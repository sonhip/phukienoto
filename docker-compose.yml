version: "3.3"

services:
  postgres:
    image: postgres:16-alpine
    container_name: phukienoto-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartlifehub}
      POSTGRES_USER: ${POSTGRES_USER:-smartlifehub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartlifehub_secret_2024}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-smartlifehub} -d ${POSTGRES_DB:-smartlifehub}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    image: sonhipp/phukienoto:v1.0.4
    container_name: phukienoto-web
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "3000:3000"
    volumes:
      - ./public/uploads:/app/public/uploads
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-smartlifehub}:${POSTGRES_PASSWORD:-smartlifehub_secret_2024}@postgres:5432/${POSTGRES_DB:-smartlifehub}

volumes:
  postgres_data:
